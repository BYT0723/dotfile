[general]
import = ["~/.config/alacritty/theme/tokyonight_night.toml"]

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
unfocused_hollow = true

[cursor.style]
blinking = "Off"
shape = "Block"

[env]
# TERM = "xterm-256color"
TERM = "alacritty"

[font]
builtin_box_drawing = true
size = 13

[font.bold]
style = "Bold"

[font.bold_italic]
style = "Bold Italic"

[font.offset]
x = 0
y = 2

[font.glyph_offset]
x = 0
y = 1

[font.italic]
style = "Italic"

[font.normal]
family = "CaskaydiaCove Nerd Font"
# family = "ComicShannsMono Nerd Font"
style = "Regular"


[mouse]
hide_when_typing = true

[scrolling]
history = 100000
multiplier = 4

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
dynamic_title = true
opacity = 0.9
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

