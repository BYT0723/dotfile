[mgr]
ratio          = [ 1, 3, 4]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "yes"
tab_size        = 2
max_width       = 1280
max_height      = 720
cache_dir       = "~/.cache/yazi"
image_delay     = 100
# image_filter    = "lanczos3"
# image_quality   = 90
# sixel_fraction  = 10
# ueberzug_scale  = 1
# ueberzug_offset = [ 0, 0, 0, 0 ]

[[plugin.prepend_fetchers]]
id   = "mime"
url  = "*"
run  = "mime-ext"
prio = "high"
