[mgr]
ratio          = [ 1, 2, 7]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Wallpaper Setting"

[preview]
wrap            = "yes"
tab_size        = 2
max_width       = 1920
max_height      = 1080
cache_dir       = "~/.cache/yazi-wallpaper"
image_delay     = 100
