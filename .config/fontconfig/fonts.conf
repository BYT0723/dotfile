<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- 简体中文 -->
    <match>
        <test name="lang">
            <string>zh-cn</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <!-- 繁体中文 -->
    <match>
        <test name="lang">
            <string>zh-tw</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK TC</string>
        </edit>
    </match>

    <!-- 日文 -->
    <match>
        <test name="lang">
            <string>ja</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK JP</string>
        </edit>
    </match>

    <!-- 韩文 -->
    <match>
        <test name="lang">
            <string>ko</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK KR</string>
        </edit>
    </match>

    <!-- 🔥 兜底：没有语言信息的全部用 SC -->
    <match target="pattern">
        <test name="family">
            <string>sans-serif</string>
        </test>
        <test name="lang" compare="not_eq">
            <string>ja</string>
        </test>
        <test name="lang" compare="not_eq">
            <string>ko</string>
        </test>
        <test name="lang" compare="not_eq">
            <string>zh-tw</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

</fontconfig>
