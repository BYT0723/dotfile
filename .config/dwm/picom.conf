#
# corner
#

corner-radius = 12;

#
# shadow
#

shadow = false;

#
# fade
#
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;

no-fading-openclose = true;
no-fading-destroyed-argb = false;

#
# animations
#
animations = ({
  triggers = [ "open", "show" ];
  preset = "appear";
},{
  triggers = [ "close", "hide" ];
  preset = "disappear";
},{
  triggers = [ "geometry" ];
  preset = "geometry-change";
  duration = 0.3;
})

#
# blur
#

blur-method = "dual_kawase";
blur-strength = 3;

#
# common
#

backend = "glx";
use-damage = true;
detect-rounded-corners = false;
detect-client-leader = true;
detect-transient = true;
# 当有窗口全屏时，picom停止工作
unredir-if-possible = false;

rules = ({
		# dwm systray and bar
		match = "class_g ?= 'Systray' || class_g ?= 'dwm'";
		animations=({ triggers = ["open","show","geometry"] });
		corner-radius = 8;
		shadow = false;
		blur-background = false;
		focus = true;
	},{
		# notifications
		match = "class_g ?= 'dunst'"
		animations=({ triggers = ["open","show","hide","close","geometry"] });
		corner-radius = 0;
	},{
		# input method
		match = "class_g ?= 'fcitx'"
		animations=({ triggers = ["open","show","close","hide","geometry"] });
		corner-radius = 12;
	},{
		# launcher
		match = "class_g ?= 'rofi'";
		focus = true;
		corner-radius = 12;
		# blur-background = false;
	},{
		# screenshot
		match = "class_g ?= 'flameshot' || class_g ?= 'slop'"
		animations=({ triggers = ["open","close","show","hide"] });
		blur-background = false;
		corner-radius = 0;
	},{
		# wallpapaer
		match = "class_g ?= 'xwinwrap'"
		animations=({ triggers = ["open","close","show","hide","geometry"] });
		blur-background = false;
		corner-radius = 0;
	},{
		# wallpapaer
		match = "class_g ?= 'conky'"
		animations=({ triggers = ["open","close","show","hide","geometry"] });
		corner-radius = 12;
	},{
		# locker
		match = "class_g ?= 'i3lock' || class_g ?= 'slock'"
		animations=({
			triggers = ["open","show"];
			preset = "slide-in";
			direction = "up";
		},{
			triggers = ["close","hide"];
			preset = "slide-out";
			direction = "up";
		});
		blur-background = false;
		corner-radius = 0;
	},

	{ match = "class_g ?= 'firefox'"                     ; blur-background = false; },
	{ match = "class_g ?= 'wemeetapp'"                   ; blur-background = false; },
	{ match = "class_g ?= 'qqmusic'"                     ; blur-background = false; },
	{ match = "class_g ?= 'wechat'"                      ; blur-background = false; },
	{ match = "class_g ?= 'steam'"                       ; blur-background = false; },
	{ match = "class_g ?= 'zoom'"                        ; blur-background = false; },
	{ match = "class_g ?= 'TelegramDesktop'"             ; blur-background = false; },
	{ match = "class_g ?= 'org.jackhuang.hmcl.Launcher'" ; blur-background = false; },
	{ match = "class_g ?= 'kvantummanager'"              ; blur-background = false; },

	{ match = "window_type = 'menu'"         ; animations=({ triggers = ["open","close","show","hide","geometry"] }); blur-background = false; },
	{ match = "window_type = 'dock'"         ; animations=({ triggers = ["open","close","show","hide","geometry"] }); blur-background = false; },
	{ match = "window_type = 'tooltip'"      ; animations=({ triggers = ["open","close","show","hide","geometry"] }); blur-background = false; },
	{ match = "window_type = 'popup_menu'"   ; animations=({ triggers = ["open","close","show","hide","geometry"] }); blur-background = false; corner-radius = 10;},
	{ match = "window_type = 'dropdown_menu'"; animations=({ triggers = ["open","close","show","hide","geometry"] }); blur-background = false; },
	{ match = "_NET_WM_STATE@ = '_NET_WM_STATE_FULLSCREEN' || _NET_WM_STATE@ ^= '_NET_WM_STATE_MAXIMIZED'"; corner-radius = 0;}
);

