#
# corner
#

corner-radius = 0;

#
# shadow
#

shadow = false;

#
# fade
#
fading = false;

#
# animations
#
animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.92;
        duration = 0.22;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.92;
        duration = 0.16;
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.18;
    }
);

#
# blur
#

blur-method = "dual_kawase";
blur-strength = 3;

#
# common
#

backend = "glx";
vsync = false;
unredir-if-possible = false;
use-damage = true;

rules = (
    { blur-background = false; },
    { match = "class_g = 'kitty'"; blur-background = true; },
    { match = "class_g = 'float-term'"; blur-background = true; },
    { match = "class_g = 'Alacritty'"; blur-background = true; },
    { match = "class_g = 'conky'"; blur-background = true; },
    {
        # dwm systray and bar
        match = "class_g ?= 'systray' || class_g ?= 'dwm'";
        corner-radius = 6;
    },
    {
        # input method
        match = "class_g ?= 'fcitx'"
        animations = ({
            triggers = [ "geometry" ];
            preset = "geometry-change";
            duration = 0.05;
        });
    },
    {
        # wallpaper: 不需要任何动画, 且避免切换壁纸时出现缩放抽动
        match = "class_g ?= 'xwallpaper'"
        animations=({ triggers = ["open","close","show","hide","geometry"] });
    },
    {
        # locker
        match = "class_g ?= 'i3lock'"
        animations=({
            triggers = ["open","show"];
            preset = "slide-in";
            direction = "up";
        },{
            triggers = ["close","hide"];
            preset = "slide-out";
            direction = "up";
        });
    },

    { match = "window_type = 'menu'"         ; animations=({ triggers = ["open","close","show","hide","geometry"] }); },
    { match = "window_type = 'dock'"         ; animations=({ triggers = ["open","close","show","hide","geometry"] }); },
    { match = "window_type = 'tooltip'"      ; animations=({ triggers = ["open","close","show","hide","geometry"] }); },
    { match = "window_type = 'popup_menu'"   ; animations=({ triggers = ["open","close","show","hide","geometry"] }); corner-radius = 12; },
    { match = "window_type = 'dropdown_menu'"; animations=({ triggers = ["open","close","show","hide","geometry"] }); },
);

