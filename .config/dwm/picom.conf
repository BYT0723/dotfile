#
# corner
#

corner-radius = 6;

#
# shadow
#

shadow = false;

#
# fade
#
fading = false;

#
# animations
#
animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.92;
        duration = 0.22;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.92;
        duration = 0.16;
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.18;
    }
);

#
# blur
#

# blur-method = "dual_kawase";
# blur-strength = 3;
#
# common
#

backend = "glx";
vsync = true;
unredir-if-possible = false;
use-damage = true;

rules = ({
        # dwm systray and bar
        match = "class_g ?= 'systray'";
        animations=({ triggers = ["open","show","geometry"] });
        corner-radius = 8;
        focus = true;
    },{
        # dwm systray and bar
        match = "class_g ?= 'dwm'";
        animations=({ triggers = ["open","show","geometry"] });
        focus = true;
    },{
        # notifications
        match = "class_g ?= 'dunst'"
        animations=({ triggers = ["open","show","hide","close","geometry"] });
        focus = true;
    },{
        # input method
        match = "class_g ?= 'fcitx'"
        animations=({ triggers = ["open","show","close","hide","geometry"] });
    },{
        # launcher
        match = "class_g ?= 'rofi'";
        focus = true;
    },{
        # screenshot
        match = "class_g ?= 'flameshot' || class_g ?= 'slop'"
        animations=({ triggers = ["open","close","show","hide","geometry"] });
        focus = true;
    },{
        # wallpaper: 不需要任何动画, 且避免切换壁纸时出现缩放抽动
        match = "class_g ?= 'xwallpaper'"
        animations=({ triggers = ["open","close","show","hide","geometry"] });
        focus = true;
        corner-radius = 0;
    },{
        # wallpapaer
        match = "class_g ?= 'conky'"
        animations=({ triggers = ["open","close","show","hide","geometry"] });
        corner-radius = 8;
        focus = true;
    },{
        # locker
        match = "class_g ?= 'i3lock' || class_g ?= 'slock'"
        animations=({
            triggers = ["open","show"];
            preset = "slide-in";
            direction = "up";
        },{
            triggers = ["close","hide"];
            preset = "slide-out";
            direction = "up";
        });
        corner-radius = 0;
        focus = true;
    },

    { match = "window_type = 'menu'"         ; animations=({ triggers = ["open","close","show","hide","geometry"] }); corner-radius = 0; },
    { match = "window_type = 'dock'"         ; animations=({ triggers = ["open","close","show","hide","geometry"] }); },
    { match = "window_type = 'tooltip'"      ; animations=({ triggers = ["open","close","show","hide","geometry"] }); },
    { match = "window_type = 'popup_menu'"   ; animations=({ triggers = ["open","close","show","hide","geometry"] }); corner-radius = 12; },
    { match = "window_type = 'dropdown_menu'"; animations=({ triggers = ["open","close","show","hide","geometry"] }); },
    { match = "_NET_WM_STATE@ = '_NET_WM_STATE_FULLSCREEN' || _NET_WM_STATE@ ^= '_NET_WM_STATE_MAXIMIZED'"; corner-radius = 0;}
);

