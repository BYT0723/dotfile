conky.config = {
    background = true,
    update_interval = 1,
    double_buffer = true,
    no_buffers = true,
    text_buffer_size = 2048,
    imlib_cache_size = 0,

    own_window = true,
    own_window_type = 'override',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 80,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    alignment = 'top_right',
    gap_x = 20,
    gap_y = 50,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,

    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    xftalpha = 0.8,

    default_color = 'white',
    color1 = '#00FFFF',  -- Cyan
    color2 = '#FF9900',  -- Orange
    color3 = '#99FF99',  -- Light Green
    color4 = '#FF5555',  -- Red
};

conky.text = [[
${font JetBrainsMono Nerd Font Mono:size=22}${color1}${time %H:%M:%S}
${font LXGW WenKai:size=12}${color}${time %A, %d %B %Y}${color}${font JetBrainsMono Nerd Font Mono:size=10}
${texeci 1800 curl wttr.in/$(curl -s http://ip-api.com/json | jq -r '.city')_0tpq.png | convert - -transparent black /tmp/weather.png}${image /tmp/weather.png -p 120,-30}
${color2}SYSTEM ${hr 2}
Hostname: ${color}$nodename
Uptime:   ${color}$uptime
Kernel:   ${color}$kernel
Load Avg: ${color}$loadavg

${color2}CPU ${hr 2}
CPU Usage: ${color}${cpu}% ${cpubar 8,100}
${color}Temp: ${execi 5 sensors | grep 'Package' | cut -d ':' -f2 | cut -d '+' -f2 | cut -d ' ' -f1}
${color}Cores: ${color1}${cpugraph 30,260}

${color2}Memory ${hr 2}
RAM:  ${color}$mem / $memmax ($memperc%) ${membar 8,100}
Swap: ${color}$swap / $swapmax ($swapperc%) ${swapbar 8,100}

${color2}DISK ${hr 2}
Root:    ${color}${fs_used /} / ${fs_size /} ${fs_bar 8,100 /}
Home:    ${color}${fs_used /home} / ${fs_size /home} ${fs_bar 8,100 /home}

${color2}NETWORK ${hr 2}
IP: ${color}${addr wlp0s20f3} ${alignr}${color2}Public:${color}${execi 3600 curl -s ip.sb}
Down: ${downspeedf wlp0s20f3} KiB/s ${alignr}Up: ${upspeedf wlp0s20f3} KiB/s
${downspeedgraph wlp0s20f3 20,140} ${alignr}${upspeedgraph wlp0s20f3 20,140}

${color2}PROCESSES ${hr 2}
Total: ${color}$processes  ${alignr}Running: ${color}$running_processes

Top CPU:
${color3}${top name 1} ${alignr}${top cpu 1}%
${color}${top name 2} ${alignr}${top cpu 2}%
${top name 3} ${alignr}${top cpu 3}%

Top MEM:
${color3}${top_mem name 1} ${alignr}${top_mem mem 1}%
${color}${top_mem name 2} ${alignr}${top_mem mem 2}%
${top_mem name 3} ${alignr}${top_mem mem 3}%
]];
