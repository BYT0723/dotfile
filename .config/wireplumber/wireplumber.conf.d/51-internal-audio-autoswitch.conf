# Enable automatic profile/port switching for internal sound card
# This allows headphone jack detection to auto-switch between
# Headphones and Speaker profiles without manual intervention

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_04_00.6"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
      }
    }
  }
]
