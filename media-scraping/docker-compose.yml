services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    network_mode: host # Enable DLNA and Wake-on-Lan
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${HOME}/Applications/media-scraping/jellyfin/config:/config
      - ${HOME}/Applications/media-scraping/jellyfin/cache:/cache
      - type: bind
        source: ${HOME}/disks/private
        target: /mnt/private
        bind:
          propagation: rshared
      - type: bind
        source: ${HOME}/disks/resource
        target: /mnt/resource
        bind:
          propagation: rshared
      - type: bind
        source: ${HOME}/Applications/media-scraping/media/movies
        target: /mnt/movies
        bind:
          propagation: rshared
      - type: bind
        source: ${HOME}/Applications/media-scraping/media/tv
        target: /mnt/tv
        bind:
          propagation: rshared
      - ${HOME}/Music/:/mnt/music
    ports:
      - 8096:8096
    restart: "no"

  metatube:
    image: ghcr.io/metatube-community/metatube-server:latest
    container_name: metatube-server
    ports:
      - 8085:8080
    restart: "no"
    environment:
      - DSN=/data/metatube.db
      - DB_AUTO_MIGRATE=1
    volumes:
      - ${HOME}/Applications/media-scraping/metatube:/data

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: "no"
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - ${HOME}/Applications/media-scraping/sonarr/config:/config
      - ${HOME}/Applications/media-scraping/media:/data

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: "no"
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - ${HOME}/Applications/media-scraping/radarr/config:/config
      - ${HOME}/Applications/media-scraping/media:/data

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: "no"
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - ${HOME}/Applications/media-scraping/prowlarr:/config

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: "no"
    ports:
      - "6767:6767"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - ${HOME}/Applications/media-scraping/bazarr/config:/config
      - ${HOME}/Applications/media-scraping/media:/data #optional

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: "no"
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8086
      - TORRENTING_PORT=6881
    volumes:
      - ${HOME}/Applications/media-scraping/qbittorrent:/config
      - ${HOME}/Applications/media-scraping/media:/data
    ports:
      - 8086:8086
      - 6881:6881
      - 6881:6881/udp
    stop_grace_period: "10s" #optional
    restart: "no"

networks:
  default:
    name: media-network
